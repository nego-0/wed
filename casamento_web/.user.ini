; ============================================================
; .user.ini — limites de envio de ficheiros
; ============================================================
; A música de fundo do convite pode ir até 8 MB, e as fotografias de
; exemplo/fatura alguns MB. Muitos alojamentos vêm com upload_max_filesize a
; 2 MB, o que recusava a música ANTES de a aplicação a ver (o utilizador só
; via "Falha no envio"). Estes valores dão folga para os 8 MB do envio mais
; o corpo do formulário.
;
; Lido pelo PHP-FPM/CGI (a maioria do alojamento partilhado). O servidor
; embutido (php -S) e o mod_php do Apache ignoram-no — nesses, os limites
; definem-se no php.ini. O .htaccess nega servir ficheiros começados por "."
; por HTTP, por isso este ficheiro não fica público.
upload_max_filesize = 16M
post_max_size = 20M
