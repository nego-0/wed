<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 812" width="1300" height="812"
     role="img" aria-label="Volutas douradas sobre fundo verde-floresta">
  <!-- Imagem de origem do INTERLÚDIO: o momento mais quieto do convite, por isso
       o desenho é o mais contido dos quatro. Ver generico-hero.svg. -->
  <defs>
    <linearGradient id="fi" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#22392C"/>
      <stop offset="0.5" stop-color="#182A21"/>
      <stop offset="1" stop-color="#101B16"/>
    </linearGradient>
    <radialGradient id="bi" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#6E9A7C" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6E9A7C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oi" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#B4864A" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#D9BC8C"/>
      <stop offset="1" stop-color="#B4864A" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1300" height="812" fill="url(#fi)"/>
  <rect width="1300" height="812" fill="url(#bi)"/>

  <!-- Arcos concêntricos, do mesmo centro: o mesmo gesto do "leque" do cartão. -->
  <g fill="none" stroke="url(#oi)" stroke-linecap="round">
    <path d="M190 700 A 520 520 0 0 1 1110 700" stroke-width="2.2" opacity="1"/>
    <path d="M262 700 A 448 448 0 0 1 1038 700" stroke-width="1.6" opacity="0.8"/>
    <path d="M334 700 A 376 376 0 0 1  966 700" stroke-width="1.2" opacity="0.6"/>
    <path d="M406 700 A 304 304 0 0 1  894 700" stroke-width="0.9" opacity="0.42"/>
  </g>

  <!-- O losango da casa, ao centro, com um filete de cada lado. -->
  <g opacity="0.9">
    <path d="M650 322 l 16 21 l -16 21 l -16 -21 z" fill="#D9BC8C"/>
    <path d="M470 343 H 606" stroke="url(#oi)" stroke-width="1.1" fill="none"/>
    <path d="M694 343 H 830" stroke="url(#oi)" stroke-width="1.1" fill="none"/>
  </g>

  <g fill="#EFE3CB">
    <circle cx="392" cy="470" r="2.2" opacity="0.22"/>
    <circle cx="915" cy="424" r="1.9" opacity="0.20"/>
    <circle cx="650" cy="560" r="1.6" opacity="0.16"/>
  </g>
</svg>
