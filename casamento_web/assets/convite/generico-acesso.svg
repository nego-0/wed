<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 812" width="1300" height="812"
     role="img" aria-label="Ilustracao de um casal de noivos em plano aproximado, com a alianca em destaque">
  <!-- Imagem de exemplo do ACESSO: o plano fechado da fotografia original, com
       as flores desfocadas de um lado e a alianca a apanhar a luz. -->
  <defs>
    <linearGradient id="afundo" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3B4C5A"/><stop offset="0.5" stop-color="#26323D"/>
      <stop offset="1" stop-color="#141B22"/></linearGradient>
    <linearGradient id="gvestido" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#EAF3FA"/><stop offset="0.45" stop-color="#C3D8E9"/>
      <stop offset="1" stop-color="#93B3CC"/></linearGradient>
    <linearGradient id="gfato" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4B84B8"/><stop offset="0.5" stop-color="#1E3D63"/>
      <stop offset="1" stop-color="#0E1D31"/></linearGradient>
    <linearGradient id="gpele" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#A2734F"/><stop offset="1" stop-color="#7A5138"/></linearGradient>
    <radialGradient id="aluz" cx="0.58" cy="0.24" r="0.52">
      <stop offset="0" stop-color="#CBDCE8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#CBDCE8" stop-opacity="0"/></radialGradient>
    <radialGradient id="avin" cx="0.56" cy="0.42" r="0.7">
      <stop offset="0.4" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.66"/></radialGradient>
    <radialGradient id="abrilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0"/></radialGradient>
    <filter id="adesfoque" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15"/></filter>
    <symbol id="afl" viewBox="-20 -20 40 40" overflow="visible"><g fill="#E9E6DC"><ellipse cx="0.0" cy="-10.0" rx="7.6" ry="5.6" transform="rotate(0 0.0 -10.0)"/><ellipse cx="9.5" cy="-3.1" rx="7.6" ry="5.6" transform="rotate(72 9.5 -3.1)"/><ellipse cx="5.9" cy="8.1" rx="7.6" ry="5.6" transform="rotate(144 5.9 8.1)"/><ellipse cx="-5.9" cy="8.1" rx="7.6" ry="5.6" transform="rotate(216 -5.9 8.1)"/><ellipse cx="-9.5" cy="-3.1" rx="7.6" ry="5.6" transform="rotate(288 -9.5 -3.1)"/></g><circle r="3.4" fill="#C9C4B4"/></symbol>
  </defs>

  <rect width="1300" height="812" fill="url(#afundo)"/>
  <rect width="1300" height="812" fill="url(#aluz)"/>
  <g filter="url(#adesfoque)"><use href="#afl" x="-56" y="37" width="135" height="162" opacity="0.27"/><use href="#afl" x="-20" y="139" width="168" height="113" opacity="0.46"/><use href="#afl" x="178" y="57" width="148" height="140" opacity="0.36"/><use href="#afl" x="299" y="20" width="102" height="185" opacity="0.35"/><use href="#afl" x="11" y="224" width="133" height="186" opacity="0.29"/><use href="#afl" x="18" y="443" width="149" height="186" opacity="0.50"/><use href="#afl" x="68" y="115" width="175" height="189" opacity="0.23"/><use href="#afl" x="205" y="687" width="159" height="120" opacity="0.48"/><use href="#afl" x="203" y="107" width="158" height="120" opacity="0.23"/><use href="#afl" x="61" y="228" width="136" height="158" opacity="0.50"/><use href="#afl" x="286" y="780" width="189" height="171" opacity="0.32"/><use href="#afl" x="3" y="476" width="149" height="161" opacity="0.25"/><use href="#afl" x="9" y="732" width="154" height="163" opacity="0.25"/><use href="#afl" x="84" y="723" width="158" height="189" opacity="0.28"/><use href="#afl" x="104" y="628" width="140" height="171" opacity="0.41"/><use href="#afl" x="-18" y="25" width="188" height="111" opacity="0.28"/><use href="#afl" x="61" y="554" width="177" height="143" opacity="0.38"/><use href="#afl" x="224" y="179" width="134" height="155" opacity="0.43"/><use href="#afl" x="-46" y="36" width="112" height="165" opacity="0.45"/><use href="#afl" x="290" y="600" width="123" height="169" opacity="0.55"/><use href="#afl" x="66" y="-50" width="134" height="125" opacity="0.28"/><use href="#afl" x="-44" y="47" width="178" height="104" opacity="0.42"/><use href="#afl" x="14" y="106" width="174" height="127" opacity="0.28"/><use href="#afl" x="104" y="538" width="147" height="177" opacity="0.35"/></g>

  <!-- O mesmo casal, num plano medio e encostado a direita: as flores ficam do
       outro lado, como na fotografia. Mais fechado do que isto, o rosto sem
       feicoes cresce demais e passa a incomodar. -->
  <g transform="translate(372 58) scale(1.42)">
    
  <!-- O NOIVO, meio passo atras -->
  <g>
    <path d="M348 142 h 26 v 44 q -13 9 -26 0 Z" fill="#6B462F"/>
    <!-- calcas: uma anca so, que depois se abre em duas pernas -->
    <path d="M300 400 L 424 400 C 426 470 424 560 420 748 L 372 748
             C 368 620 366 540 362 470 C 358 540 356 620 352 748 L 304 748
             C 300 560 298 470 300 400 Z" fill="url(#gfato)"/>
    <!-- tronco -->
    <path d="M342 188 C 314 200 302 238 300 286 C 298 336 300 378 302 412
             L 422 412 C 424 378 426 336 424 286 C 422 238 410 200 382 188
             C 370 200 354 200 342 188 Z" fill="url(#gfato)"/>
    <path d="M362 194 L 362 408" stroke="#0F2135" stroke-width="2.4" opacity="0.7"/>
    <path d="M342 190 L 362 226 L 382 190" fill="none" stroke="#0F2135"
          stroke-width="2" opacity="0.55"/>
    <path d="M388 244 h 30 v 36 h -30 z" fill="none" stroke="#0F2135"
          stroke-width="1.6" opacity="0.45"/>
    <!-- braco de fora, afilado -->
    <path d="M418 206 C 434 234 442 296 440 350 C 440 364 428 366 425 352
             C 423 302 418 258 406 226 Z" fill="url(#gfato)"/>
    <!-- o braco de dentro nao se desenha: fica por tras dela -->
    <ellipse cx="360" cy="104" rx="37" ry="44" fill="url(#gpele)"/>
    <path d="M324 100 C 323 66 341 48 361 48 C 382 48 398 66 397 102
             C 385 82 372 74 359 74 C 344 74 331 84 324 100 Z" fill="#241A16"/>
  </g>

  <!-- A NOIVA, a frente -->
  <g>
    <!-- o cabelo que fica por tras: volume, e uma onda de um lado so -->
    <ellipse cx="197" cy="114" rx="41" ry="49" fill="#241A16"/>
    <path d="M232 120 C 250 168 252 232 240 288 C 234 316 222 336 210 346
             C 226 306 232 250 226 196 Z" fill="#241A16"/>
    <path d="M162 128 C 150 176 150 232 158 280 C 160 294 152 300 146 288
             C 136 244 138 176 152 132 Z" fill="#241A16"/>
    <path d="M185 164 h 25 v 46 q -12 10 -25 0 Z" fill="#6B462F"/>
    <!-- saia -->
    <path d="M162 344 C 148 442 128 566 110 716 C 107 736 114 748 132 748
             L 266 748 C 284 748 291 736 288 716 C 270 566 250 442 236 344 Z"
          fill="url(#gvestido)"/>
    <path d="M174 356 C 162 462 148 578 136 716" stroke="#7E9FBA"
          stroke-width="2" fill="none" opacity="0.45"/>
    <path d="M200 356 C 199 462 198 578 197 716" stroke="#7E9FBA"
          stroke-width="1.6" fill="none" opacity="0.3"/>
    <path d="M226 356 C 236 462 250 578 262 716" stroke="#7E9FBA"
          stroke-width="2" fill="none" opacity="0.45"/>
    <!-- corpete, com o decote em coracao -->
    <path d="M160 226 C 172 216 188 214 199 222 C 210 214 226 216 238 226
             C 244 262 246 306 240 348 C 212 360 186 360 158 348
             C 152 306 154 262 160 226 Z" fill="url(#gvestido)"/>
    <path d="M160 226 C 174 240 189 242 199 234 C 209 242 224 240 238 226"
          fill="none" stroke="#FFF" stroke-width="2.2" opacity="0.6"/>
    <!-- Um braco desce ao lado, o outro pousa-lhe a mao no peito. Dois bracos
         a fechar sobre a cintura desenhavam uma ferradura, e nao um casal. -->
    <g stroke="#8B5E40" stroke-width="12" fill="none" stroke-linecap="round">
      <path d="M158 242 C 134 274 130 322 138 366"/>
      <path d="M236 240 C 262 252 288 266 308 280"/>
    </g>
    <ellipse cx="139" cy="376" rx="9" ry="13" fill="#8B5E40"/>
    <ellipse cx="315" cy="284" rx="16" ry="11" fill="#8B5E40"
             transform="rotate(16 315 284)"/>
    <circle cx="308" cy="279" r="3.2" fill="#E7D9A8"/>
    <!-- cabeca -->
    <ellipse cx="197" cy="124" rx="38" ry="46" fill="url(#gpele)"/>
    <path d="M160 116 C 158 78 178 58 200 58 C 226 58 244 80 242 118
             C 230 94 216 86 197 88 C 178 90 166 100 160 116 Z" fill="#241A16"/>
    <circle cx="163" cy="140" r="3.6" fill="#E7D9A8"/>
  </g>

  </g>

  <!-- A alianca, sobre a mao que lhe pousa no peito: o ponto de luz. -->
  <g transform="translate(819 461) rotate(-12)">
    <ellipse rx="22" ry="18" fill="none" stroke="#C9A227" stroke-width="7"/>
    <ellipse rx="22" ry="18" fill="none" stroke="#F1DFA0" stroke-width="2.4"/>
    <path d="M0 -36 l 12 14 l -12 14 l -12 -14 z" fill="#F8F3E2"/>
    <path d="M0 -36 l 12 14 l -12 14 z" fill="#D6C9A6"/>
    <circle cy="-22" r="46" fill="url(#abrilho)" opacity="0.55"/>
  </g>

  <rect width="1300" height="812" fill="url(#avin)"/>
</svg>
