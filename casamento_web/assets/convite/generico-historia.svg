<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750"
     role="img" aria-label="Ilustracao de duas aliancas douradas sobre um fundo azul desfocado">
  <!-- Imagem de exemplo da HISTORIA: o momento da alianca, como na fotografia
       original - o azul do fato a encher o quadro e o brilho ao centro. -->
  <defs>
    <linearGradient id="hfundo" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3C6E9E"/><stop offset="0.45" stop-color="#1E3D63"/>
      <stop offset="1" stop-color="#0E1E33"/></linearGradient>
    <linearGradient id="haro" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#F0DFAE"/><stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8A6E1B"/></linearGradient>
    <radialGradient id="hbrilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="hvin" cx="0.46" cy="0.48" r="0.72">
      <stop offset="0.48" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/></radialGradient>
    <filter id="desfoque" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/></filter>
    <filter id="desfoque2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="1200" height="750" fill="url(#hfundo)"/>
  <!-- as pregas e as costuras da camisa, desfocadas: e o fundo da fotografia -->
  <g filter="url(#desfoque)" opacity="0.5">
    <path d="M300 0 V 750" stroke="#0E1E33" stroke-width="26" fill="none"/>
    <path d="M170 60 h 130 v 160 h -130 z" stroke="#0E1E33" stroke-width="14" fill="none"/>
    <path d="M520 30 h 140 v 175 h -140 z" stroke="#0E1E33" stroke-width="14" fill="none"/>
    <path d="M70 320 C 140 360 140 470 70 520" stroke="#4C82B4" stroke-width="16" fill="none"/>
    <path d="M860 0 C 900 200 900 520 860 750" stroke="#4C82B4" stroke-width="20" fill="none"/>
  </g>
  <g filter="url(#desfoque2)"><circle cx="543" cy="420" r="43" fill="#CFE4F2" opacity="0.10"/><circle cx="609" cy="441" r="17" fill="#CFE4F2" opacity="0.11"/><circle cx="756" cy="595" r="13" fill="#CFE4F2" opacity="0.08"/><circle cx="109" cy="607" r="35" fill="#CFE4F2" opacity="0.05"/><circle cx="1179" cy="724" r="34" fill="#CFE4F2" opacity="0.12"/><circle cx="189" cy="11" r="29" fill="#CFE4F2" opacity="0.06"/><circle cx="228" cy="181" r="11" fill="#CFE4F2" opacity="0.10"/><circle cx="529" cy="632" r="29" fill="#CFE4F2" opacity="0.12"/><circle cx="600" cy="497" r="26" fill="#CFE4F2" opacity="0.08"/><circle cx="1197" cy="747" r="40" fill="#CFE4F2" opacity="0.13"/><circle cx="378" cy="172" r="20" fill="#CFE4F2" opacity="0.06"/><circle cx="920" cy="300" r="40" fill="#CFE4F2" opacity="0.09"/><circle cx="1150" cy="635" r="10" fill="#CFE4F2" opacity="0.07"/><circle cx="1092" cy="352" r="45" fill="#CFE4F2" opacity="0.09"/><circle cx="88" cy="472" r="38" fill="#CFE4F2" opacity="0.08"/><circle cx="105" cy="249" r="45" fill="#CFE4F2" opacity="0.13"/><circle cx="142" cy="185" r="14" fill="#CFE4F2" opacity="0.06"/><circle cx="956" cy="133" r="30" fill="#CFE4F2" opacity="0.10"/><circle cx="229" cy="549" r="15" fill="#CFE4F2" opacity="0.12"/><circle cx="140" cy="316" r="18" fill="#CFE4F2" opacity="0.08"/><circle cx="1165" cy="603" r="21" fill="#CFE4F2" opacity="0.15"/><circle cx="253" cy="296" r="41" fill="#CFE4F2" opacity="0.12"/><circle cx="120" cy="742" r="18" fill="#CFE4F2" opacity="0.08"/><circle cx="927" cy="247" r="21" fill="#CFE4F2" opacity="0.06"/><circle cx="108" cy="437" r="19" fill="#CFE4F2" opacity="0.12"/><circle cx="446" cy="340" r="45" fill="#CFE4F2" opacity="0.10"/></g>

  <!-- a manga bordada dela, desfocada e a sair do quadro: na fotografia esta
       ali, mas so como um brilho fora de foco -->
  <g filter="url(#desfoque)" opacity="0.5">
    <path d="M1300 180 C 1180 220 1130 340 1140 460 C 1148 570 1210 650 1300 690 Z"
          fill="#9FC0DA"/>
  </g>
  <g opacity="0.65"><circle cx="1232" cy="601" r="2.7" fill="#FFF" opacity="0.43"/><circle cx="1285" cy="580" r="3.0" fill="#FFF" opacity="0.45"/><circle cx="1258" cy="634" r="2.8" fill="#FFF" opacity="0.87"/><circle cx="1281" cy="486" r="3.7" fill="#FFF" opacity="0.41"/><circle cx="1146" cy="644" r="3.0" fill="#FFF" opacity="0.74"/><circle cx="1181" cy="582" r="4.4" fill="#FFF" opacity="0.51"/><circle cx="1168" cy="537" r="2.3" fill="#FFF" opacity="0.48"/><circle cx="1229" cy="595" r="4.5" fill="#FFF" opacity="0.50"/><circle cx="1287" cy="310" r="2.1" fill="#FFF" opacity="0.50"/><circle cx="1211" cy="247" r="2.7" fill="#FFF" opacity="0.55"/><circle cx="1232" cy="278" r="3.4" fill="#FFF" opacity="0.84"/><circle cx="1297" cy="509" r="4.8" fill="#FFF" opacity="0.67"/><circle cx="1162" cy="235" r="2.1" fill="#FFF" opacity="0.85"/><circle cx="1252" cy="644" r="2.1" fill="#FFF" opacity="0.70"/><circle cx="1217" cy="541" r="3.3" fill="#FFF" opacity="0.90"/><circle cx="1152" cy="460" r="4.9" fill="#FFF" opacity="0.85"/><circle cx="1258" cy="530" r="5.2" fill="#FFF" opacity="0.85"/><circle cx="1196" cy="521" r="5.6" fill="#FFF" opacity="0.83"/><circle cx="1207" cy="568" r="5.5" fill="#FFF" opacity="0.67"/><circle cx="1240" cy="388" r="4.3" fill="#FFF" opacity="0.68"/><circle cx="1153" cy="501" r="6.0" fill="#FFF" opacity="0.83"/><circle cx="1257" cy="391" r="4.9" fill="#FFF" opacity="0.67"/><circle cx="1210" cy="589" r="2.3" fill="#FFF" opacity="0.76"/><circle cx="1145" cy="485" r="3.9" fill="#FFF" opacity="0.48"/><circle cx="1252" cy="439" r="4.5" fill="#FFF" opacity="0.86"/><circle cx="1181" cy="225" r="3.2" fill="#FFF" opacity="0.72"/><circle cx="1172" cy="295" r="5.6" fill="#FFF" opacity="0.71"/><circle cx="1211" cy="612" r="3.3" fill="#FFF" opacity="0.72"/><circle cx="1172" cy="410" r="5.2" fill="#FFF" opacity="0.85"/><circle cx="1281" cy="389" r="4.3" fill="#FFF" opacity="0.52"/><circle cx="1162" cy="438" r="5.3" fill="#FFF" opacity="0.82"/><circle cx="1254" cy="638" r="3.1" fill="#FFF" opacity="0.44"/><circle cx="1212" cy="341" r="2.9" fill="#FFF" opacity="0.58"/><circle cx="1240" cy="437" r="3.3" fill="#FFF" opacity="0.81"/><circle cx="1297" cy="419" r="2.3" fill="#FFF" opacity="0.37"/><circle cx="1280" cy="238" r="4.8" fill="#FFF" opacity="0.66"/><circle cx="1189" cy="568" r="2.1" fill="#FFF" opacity="0.42"/><circle cx="1213" cy="231" r="5.3" fill="#FFF" opacity="0.48"/><circle cx="1163" cy="241" r="4.5" fill="#FFF" opacity="0.60"/><circle cx="1241" cy="508" r="5.2" fill="#FFF" opacity="0.88"/></g>

  <!-- as duas aliancas, ao centro e nitidas: e para ali que se olha -->
  <g transform="translate(506 396)">
    <ellipse rx="112" ry="104" fill="none" stroke="url(#haro)" stroke-width="21"/>
    <ellipse rx="112" ry="104" fill="none" stroke="#F6EBC4" stroke-width="4" opacity="0.7"/>
  </g>
  <g transform="translate(650 426)">
    <ellipse rx="96" ry="90" fill="none" stroke="url(#haro)" stroke-width="18" opacity="0.95"/>
    <ellipse rx="96" ry="90" fill="none" stroke="#F6EBC4" stroke-width="3.4" opacity="0.6"/>
    <g transform="translate(0 -90)">
      <path d="M0 -46 L 26 -14 L 0 26 L -26 -14 Z" fill="#F8F3E2"/>
      <path d="M0 -46 L 26 -14 L 0 26 Z" fill="#DACDA9"/>
      <path d="M-26 -14 H 26" stroke="#FFF" stroke-width="2.4" opacity="0.8"/>
      <circle cy="-10" r="86" fill="url(#hbrilho)" opacity="0.55"/>
    </g>
  </g>

  <rect width="1200" height="750" fill="url(#hvin)"/>
</svg>
