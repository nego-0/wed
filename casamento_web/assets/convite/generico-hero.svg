<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1247" width="1000" height="1247"
     role="img" aria-label="Arco de folhagem dourada sobre fundo verde-floresta">
  <!-- Imagem de origem da CAPA. Não é uma fotografia: é o desenho da casa, para
       que um convite acabado de nascer (ou um modelo) não mostre o retrato de
       um casal a outro. Mesma paleta do convite: verde-floresta e dourado. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#31503E"/>
      <stop offset="0.45" stop-color="#22392C"/>
      <stop offset="1" stop-color="#13201A"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#5D8468" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5D8468" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFE3CB"/>
      <stop offset="0.5" stop-color="#D9BC8C"/>
      <stop offset="1" stop-color="#B4864A"/>
    </linearGradient>
    <!-- Uma folha, usada muitas vezes ao longo dos ramos. -->
    <symbol id="folha" viewBox="0 0 40 18">
      <path d="M0 9 C 10 -4 30 -4 40 9 C 30 22 10 22 0 9 Z" fill="none" stroke="url(#ouro)" stroke-width="1.4"/>
      <path d="M2 9 H 38" stroke="url(#ouro)" stroke-width="0.8" opacity="0.7"/>
    </symbol>
  </defs>

  <rect width="1000" height="1247" fill="url(#fundo)"/>
  <rect width="1000" height="1247" fill="url(#brilho)"/>

  <!-- O arco: dois ramos que sobem e se encontram no alto. -->
  <g fill="none" stroke="url(#ouro)" stroke-linecap="round">
    <path d="M120 1180 C 96 900 150 620 300 430 C 380 330 450 270 500 232"
          stroke-width="2.4" opacity="0.95"/>
    <path d="M880 1180 C 904 900 850 620 700 430 C 620 330 550 270 500 232"
          stroke-width="2.4" opacity="0.95"/>
    <path d="M168 1180 C 150 920 200 660 330 486" stroke-width="1" opacity="0.5"/>
    <path d="M832 1180 C 850 920 800 660 670 486" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Folhas ao longo dos dois ramos, viradas para fora. -->
  <g opacity="0.92">
    <use href="#folha" x="96"  y="1052" width="86" height="39" transform="rotate(-104 139 1071)"/>
    <use href="#folha" x="88"  y="930"  width="92" height="41" transform="rotate(-96 134 950)"/>
    <use href="#folha" x="92"  y="806"  width="88" height="40" transform="rotate(-86 136 826)"/>
    <use href="#folha" x="106" y="684"  width="84" height="38" transform="rotate(-76 148 703)"/>
    <use href="#folha" x="130" y="566"  width="80" height="36" transform="rotate(-64 170 584)"/>
    <use href="#folha" x="168" y="458"  width="76" height="34" transform="rotate(-52 206 475)"/>
    <use href="#folha" x="222" y="366"  width="72" height="32" transform="rotate(-40 258 382)"/>
    <use href="#folha" x="290" y="292"  width="66" height="30" transform="rotate(-30 323 307)"/>
    <use href="#folha" x="366" y="244"  width="58" height="26" transform="rotate(-18 395 257)"/>

    <use href="#folha" x="818" y="1052" width="86" height="39" transform="rotate(104 861 1071)"/>
    <use href="#folha" x="820" y="930"  width="92" height="41" transform="rotate(96 866 950)"/>
    <use href="#folha" x="820" y="806"  width="88" height="40" transform="rotate(86 864 826)"/>
    <use href="#folha" x="810" y="684"  width="84" height="38" transform="rotate(76 852 703)"/>
    <use href="#folha" x="790" y="566"  width="80" height="36" transform="rotate(64 830 584)"/>
    <use href="#folha" x="756" y="458"  width="76" height="34" transform="rotate(52 794 475)"/>
    <use href="#folha" x="706" y="366"  width="72" height="32" transform="rotate(40 742 382)"/>
    <use href="#folha" x="644" y="292"  width="66" height="30" transform="rotate(30 677 307)"/>
    <use href="#folha" x="576" y="244"  width="58" height="26" transform="rotate(18 605 257)"/>
  </g>

  <!-- O remate do arco: um losango entre as duas pontas. -->
  <path d="M500 214 l 13 17 l -13 17 l -13 -17 z" fill="url(#ouro)" opacity="0.95"/>

  <!-- Poeira de luz, muito ao de leve. -->
  <g fill="#EFE3CB">
    <circle cx="238" cy="742"  r="2.6" opacity="0.30"/>
    <circle cx="781" cy="612"  r="2.2" opacity="0.26"/>
    <circle cx="340" cy="982"  r="1.8" opacity="0.22"/>
    <circle cx="676" cy="880"  r="2.4" opacity="0.24"/>
    <circle cx="452" cy="656"  r="1.6" opacity="0.20"/>
    <circle cx="566" cy="1046" r="2.0" opacity="0.20"/>
  </g>

  <!-- Escurece o pé, que é onde o convite assenta o texto. -->
  <rect y="890" width="1000" height="357" fill="url(#pe)"/>
  <defs>
    <linearGradient id="pe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13201A" stop-opacity="0"/>
      <stop offset="1" stop-color="#13201A" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
</svg>
