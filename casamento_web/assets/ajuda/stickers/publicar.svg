<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
<style>
g{fill:none;stroke:#173b2c;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.claro{stroke:#fff;stroke-width:6}.acento{stroke:#d6a959;stroke-width:6}.balanco{transform-origin:center;animation:balanco 1.8s ease-in-out infinite}.pulso{transform-box:fill-box;transform-origin:center;animation:pulso 1.55s ease-in-out infinite}.riscar{transform-box:fill-box;transform-origin:center;animation:riscar 1.45s ease-in-out infinite}.voar{transform-origin:center;animation:voar 1.8s ease-in-out infinite}.lupa{transform-origin:54px 55px;animation:lupa 1.65s ease-in-out infinite}.descer{animation:descer 1.55s ease-in-out infinite}.deslizar{animation:deslizar 1.65s ease-in-out infinite}.vapor{animation:vapor 1.7s ease-in-out infinite}.volta{animation:volta 1.55s ease-in-out infinite}
@keyframes balanco{0%,100%{transform:rotate(-2deg) translateY(1px)}50%{transform:rotate(2deg) translateY(-3px)}}@keyframes pulso{0%,100%{transform:scale(.82)}50%{transform:scale(1.08)}}@keyframes riscar{0%,100%{transform:translate(-5px,-3px) rotate(-3deg)}50%{transform:translate(5px,3px) rotate(3deg)}}@keyframes voar{0%,100%{transform:translate(-4px,3px) rotate(-3deg)}50%{transform:translate(6px,-5px) rotate(2deg)}}@keyframes lupa{0%,100%{transform:rotate(-8deg) scale(.95)}55%{transform:rotate(4deg) scale(1.04)}}@keyframes descer{0%,100%{transform:translateY(-5px)}55%{transform:translateY(5px)}}@keyframes deslizar{0%,18%{transform:translateX(0)}55%,82%{transform:translateX(44px)}100%{transform:translateX(0)}}@keyframes vapor{0%,100%{transform:translateY(5px);opacity:.3}50%{transform:translateY(-5px);opacity:1}}@keyframes volta{0%,100%{stroke-dasharray:18 110;stroke-dashoffset:0}50%{stroke-dasharray:80 30;stroke-dashoffset:-20}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
